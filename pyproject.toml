[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "func-to-web"
description = "Expose typed Python functions as web interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Beltrán Offerrall" }]
keywords = ["web", "forms", "type-hints", "ui"]
dynamic = ["version"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "pytypehint==0.0.7",
    "pytypehintweb==0.0.5",
    "fastapi==0.121.1",
    "uvicorn==0.38.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "httpx",
    "build",
    "twine",
]
test-outputs = [
    "pandas",
    "polars",
    "numpy",
    "pillow",
    "matplotlib",
]
# Development only: it never reaches the runtime dependencies of the package.
# The browser itself is not a Python package; after installing this extra run
# `python -m playwright install chromium` once. Without it the tests of
# tests/e2e skip themselves instead of failing.
test-browser = [
    "playwright",
]

[project.urls]
Homepage = "https://github.com/offerrall/FuncToWeb"
Source = "https://github.com/offerrall/FuncToWeb"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "browser: needs a real headless browser",
    "package: builds or installs the distribution",
    "slow: takes noticeably longer than a unit test",
]

[tool.coverage.run]
branch = true
source = ["func_to_web"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# pytypehintweb ships py.typed but leaves decode() unannotated; excluding it
# keeps every other strict check on our own calls.
untyped_calls_exclude = ["pytypehintweb"]

[tool.setuptools.dynamic]
# config.py, not __init__.py: there the version is a literal assignment, so
# setuptools reads it from the AST instead of importing the package —which at
# build time cannot import its own runtime dependencies.
version = { attr = "func_to_web.config.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
func_to_web = [
    "py.typed",
    "static/*.js",
    "static/*.css",
    # A subdirectory is not swept in by static/*: the icons page.css masks would
    # ship as 404s without this line.
    "static/icons/*.svg",
]
"func_to_web.templates" = ["*.html"]
